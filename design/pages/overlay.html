<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BLACKOUT • Overlay</title>

    <link rel="stylesheet"
        href="D://portfolio/void/design/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
        rel="stylesheet">

</head>

<body class="amoled">

    <main class="overlay fade-in">



        <!-- ========================================= -->
        <!-- STATUS -->
        <!-- ========================================= -->

        <div
            style="
            position:absolute;
            top:32px;
            left:50%;
            transform:translateX(-50%);
        ">

            <div class="chip">

                <div class="chip-dot"></div>

                BLACKOUT ACTIVE

            </div>

        </div>





        <!-- ========================================= -->
        <!-- CLOCK -->
        <!-- ========================================= -->

        <div class="overlay-clock">

            12:41

        </div>





        <!-- ========================================= -->
        <!-- DATE -->
        <!-- ========================================= -->

        <div
            style="
            position:absolute;
            top:56%;
            left:50%;
            transform:translateX(-50%);
            color:#B3B3B3;
            font-size:18px;
        ">

            Tuesday

            •

            July 28

        </div>





        <!-- ========================================= -->
        <!-- NOW PLAYING -->
        <!-- ========================================= -->

        <div
            style="
            position:absolute;
            bottom:170px;
            left:50%;
            transform:translateX(-50%);
            width:320px;
        ">

            <div class="card">

                <div class="body">

                    ▶ Now Playing

                </div>

                <div
                    style="
                    margin-top:12px;
                    font-size:18px;
                    font-weight:600;
                ">

                    Never Gonna Give You Up

                </div>

                <div
                    class="text-secondary mt-2">

                    Rick Astley

                </div>

            </div>

        </div>





        <!-- ========================================= -->
        <!-- TAP HINT -->
        <!-- ========================================= -->

        <div
            style="
            position:absolute;
            bottom:120px;
            width:100%;
            text-align:center;
            color:#6E6E6E;
            font-size:13px;
        ">

            Double tap or press Power to wake

        </div>





        <!-- ========================================= -->
        <!-- EXIT BUTTON -->
        <!-- ========================================= -->

        <button
            class="fab"
            style="
            bottom:36px;
            right:36px;
        ">

            <span class="material-symbols-rounded">

                close

            </span>

        </button>



    </main>

</body>

</html>
